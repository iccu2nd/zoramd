<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Users — ZoraBot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/style.css?v=27" />
</head>
<body data-page="admin-users">
  <div id="loading-view" class="loading-wrap hidden" style="display:none" aria-hidden="true">
    <div class="loading-card">
      <div class="loading-logo">ZoraBot</div>
      <p class="loading-text" id="loading-text">Loading...</p>
    </div>
  </div>
  <div id="main-view">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="brand">ZoraBot</div>
      <div class="user-chip" id="user-chip"></div>
    </header>
    <aside id="sidebar" class="sidebar">
      <nav>
        <div class="nav-label">Admin</div>
        <a href="/admin" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Overview</span></a>
        <a href="/admin/users" class="nav-item active"><i class="fa-solid fa-users"></i><span>Users</span></a>
        <a href="/admin/bots" class="nav-item"><i class="fa-solid fa-robot"></i><span>Bots</span></a>
        <a href="/admin/ads" class="nav-item"><i class="fa-solid fa-bullhorn"></i><span>Ads</span></a>
        <a href="/admin/errors" class="nav-item"><i class="fa-solid fa-bug"></i><span>Error logs</span></a>
        <div class="nav-label">Back</div>
        <a href="/dashboard" class="nav-item"><i class="fa-solid fa-arrow-left"></i><span>Dashboard</span></a>
      </nav>
      <button id="logout-btn" class="btn outline logout"><i class="fa-solid fa-right-from-bracket"></i><span>Log out</span></button>
    </aside>
    <div id="sidebar-overlay" class="overlay"></div>
    <main class="content">
      <h2>Users</h2>
      <p class="hint">Search, filter, and manage account roles. Server-side pagination.</p>
      <div id="admin-stats" class="limits-bar" style="margin-bottom:16px;min-height:40px"></div>
      <div class="admin-filters row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <input type="search" id="users-q" class="input" placeholder="Search email or name" style="min-width:180px;flex:1" />
        <select id="users-role" class="input" style="width:auto">
          <option value="">All roles</option>
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
        <select id="users-sort" class="input" style="width:auto">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="email">Email A–Z</option>
        </select>
        
      </div>
      <div class="plan-card" style="min-height:120px">
        <div id="admin-users" class="bots-list" style="margin-top:4px"></div>
        <div id="users-pager" class="row" style="gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap"></div>
      </div>
    </main>
  </div>
  <script src="/js/bg-pattern.js?v=27"></script>
  <script src="/js/common.js?v=27"></script>
  <script src="/js/admin.js?v=27"></script>
</body>
</html>
