<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Plan Premium — ZoraBot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="upgrade">
  <div id="loading-view" class="loading-wrap hidden" style="display:none">
    <div class="loading-card">
      <div class="loading-logo">ZoraBot</div>
            <div class="spinner center" aria-hidden="true">
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
        <div class="spinner-blade"></div>
      </div>
      <p class="loading-text" id="loading-text">Memuat...</p>
    </div>
  </div>

  <div id="main-view">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">ZoraBot</div>
      <div class="user-chip" id="user-chip"></div>
    </header>

    <aside id="sidebar" class="sidebar">
            <nav>
        <div class="nav-label">Menu</div>
        <a href="/dashboard" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
        <a href="/connect" class="nav-item"><i class="fa-solid fa-qrcode"></i><span>Connect Bot</span></a>
        <a href="/bot-settings" class="nav-item"><i class="fa-solid fa-sliders"></i><span>Bot Settings</span></a>
        <a href="/feature-settings" class="nav-item"><i class="fa-solid fa-puzzle-piece"></i><span>Feature Settings</span></a>
        <a href="/database" class="nav-item"><i class="fa-solid fa-database"></i><span>Database</span></a>
        <a href="/chatlog" class="nav-item"><i class="fa-solid fa-comments"></i><span>Live Chatlog</span></a>
<div class="nav-label">Premium</div>
        <a href="/upgrade" class="nav-item active"><i class="fa-solid fa-crown"></i><span>Order Plan Premium</span></a>
        <div class="nav-label">Akun</div>
        <a href="/account" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
        <a href="/admin" class="nav-item nav-admin hidden" id="nav-admin"><i class="fa-solid fa-shield-halved"></i><span>Admin Panel</span></a>
      </nav>
      <button id="logout-btn" class="btn outline logout"><i class="fa-solid fa-right-from-bracket"></i><span>Keluar</span></button>
    </aside>
    <div id="sidebar-overlay" class="overlay"></div>

    <main class="content">
      <h2>Order Plan Premium</h2>
      <div class="plan-card">
        <div id="plan-details">
          <h3>Premium</h3>
          <p class="price" id="plan-price">Rp10.000 <span>/ 30 hari</span></p>
          <div class="field">
            <label>Durasi</label>
            <select id="plan-duration">
              <option value="7d">7 Hari — Rp5.000</option>
              <option value="30d" selected>30 Hari — Rp10.000</option>
            </select>
          </div>
        </div>
        <button id="order-premium-btn" class="btn primary">Order Premium</button>
        <div id="payment-info" class="payment-info hidden"></div>
        <p id="upgrade-msg" class="msg"></p>
      </div>
    </main>
  </div>

  <script src="/js/bg-pattern.js?v=16"></script>
  <script src="/js/common.js?v=16"></script>
  <script src="/js/upgrade.js?v=16"></script>

  <script>
  // Safety net: jangan pernah stuck loading > 6 detik
  setTimeout(function () {
    var lv = document.getElementById('loading-view');
    var mv = document.getElementById('main-view');
    if (lv && !lv.classList.contains('hidden') && getComputedStyle(lv).display !== 'none') {
      lv.classList.add('hidden');
      lv.style.display = 'none';
      if (mv) { mv.classList.remove('hidden'); mv.style.display = ''; }
    }
  }, 1500);
  </script>
</body>
</html>
