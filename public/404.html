<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Halaman tidak ditemukan — ZoraBot</title>
  <link rel="stylesheet" href="/css/style.css?v=23" />
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .nf-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
    }
    .nf-mark {
      width: 80px;
      height: 80px;
      margin: 0 auto 22px;
      animation: nfFloat 3.2s var(--ease) infinite;
    }
    .nf-mark img { width: 100%; height: 100%; display: block; }
    .nf-code {
      font-size: 13px;
      font-weight: 600;
      font-style: italic;
      font-family: var(--font-display);
      color: var(--purple-2);
      margin-bottom: 10px;
    }
    .nf-title {
      font-size: 24px;
      font-weight: 600;
      font-family: var(--font-display);
      color: var(--text);
      margin-bottom: 10px;
    }
    .nf-desc {
      font-size: 14.5px;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .nf-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    @keyframes nfFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nf-mark { animation: none; }
    }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-card">
      <div class="scrap-note tag-purple" style="top:-10px; left:-52px; transform:rotate(-5deg)">nyasar, kayaknya</div>
      <div class="nf-mark">
        <img src="/img/mascot-cat.svg" alt="" aria-hidden="true" />
      </div>
      <div class="nf-code">404 — tidak ditemukan</div>
      <h1 class="nf-title">Halaman tidak ditemukan</h1>
      <p class="nf-desc">Halaman yang kamu cari sudah dipindahkan, dihapus, atau memang tidak pernah ada.</p>
      <div class="nf-actions">
        <a href="/" class="btn primary">Kembali ke Beranda</a>
        <a href="javascript:history.back()" class="btn outline">Halaman Sebelumnya</a>
      </div>
    </div>
  </div>
</body>
</html>
