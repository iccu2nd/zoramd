<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Chat Log — ZoraBot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/style.css?v=26" />
</head>
<body data-page="chatlog">
  <div id="loading-view" class="loading-wrap">
    <div class="loading-card">
      <div class="loading-logo">ZoraBot</div>
      <div class="spinner center" aria-hidden="true">
        <div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div>
        <div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div>
        <div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div>
      </div>
      <p class="loading-text" id="loading-text">Loading...</p>
    </div>
  </div>

  <div id="main-view" class="hidden">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">ZoraBot</div>
      <div class="user-chip" id="user-chip"></div>
    </header>

    <aside id="sidebar" class="sidebar">
      <nav>
        <div class="nav-label">Menu</div>
        <a href="/dashboard" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
        <a href="/connect" class="nav-item"><i class="fa-solid fa-qrcode"></i><span>Connect Bot</span></a>
        <a href="/bot-settings" class="nav-item"><i class="fa-solid fa-sliders"></i><span>Bot Settings</span></a>
        <a href="/feature-settings" class="nav-item"><i class="fa-solid fa-puzzle-piece"></i><span>Feature Settings</span></a>
<a href="/database" class="nav-item"><i class="fa-solid fa-database"></i><span>Database</span></a>
        <a href="/chatlog" class="nav-item active"><i class="fa-solid fa-comments"></i><span>Live Chat Log</span></a>
        <div class="nav-label">Premium</div>
        <a href="/upgrade" class="nav-item"><i class="fa-solid fa-crown"></i><span>Upgrade</span></a>
        <a href="/orders" class="nav-item"><i class="fa-solid fa-receipt"></i><span>Orders</span></a>
        <div class="nav-label">Account</div>
        <a href="/account" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
        <a href="/admin" class="nav-item nav-admin hidden" id="nav-admin"><i class="fa-solid fa-shield-halved"></i><span>Admin</span></a>
      </nav>
      <button id="logout-btn" class="btn outline logout"><i class="fa-solid fa-right-from-bracket"></i><span>Log out</span></button>
    </aside>
    <div id="sidebar-overlay" class="overlay"></div>

    <main class="content">
      <h2>Live Chat Log</h2>
      <p class="hint">8 pesan WhatsApp terbaru. Tidak disimpan permanen.</p>
      <div class="field">
        <label>Select bot</label>
        <select id="chatlog-bot-select"></select>
      </div>
      <div id="chatlog-list" class="chatlog-list"></div>
    </main>
  </div>

  <script src="/js/bg-pattern.js?v=11"></script>
  <script src="/js/common.js?v=26"></script>
  <script src="/js/chatlog.js?v=11"></script>
  <script>
  setTimeout(function () {
    var lv = document.getElementById('loading-view');
    var mv = document.getElementById('main-view');
    if (lv && getComputedStyle(lv).display !== 'none') {
      lv.classList.add('hidden'); lv.style.display = 'none';
      if (mv) { mv.classList.remove('hidden'); mv.style.display = ''; }
    }
  }, 3500);
  </script>
</body>
</html>
