<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk — ZoraBot</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="loading-view" class="loading-wrap">
    <div class="loading-card">
      <div class="loading-logo">ZoraBot</div>
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-text" id="loading-text">Memuat...</p>
    </div>
  </div>

  <div id="auth-view" class="auth-wrap hidden">
    <div class="auth-card">
      <h1>ZoraBot</h1>
      <p class="subtitle">WhatsApp JadiBot Platform</p>
      <p id="auth-notice" class="auth-notice hidden"></p>
      <div class="tabs">
        <button type="button" id="tab-login" class="tab active">Masuk</button>
        <button type="button" id="tab-register" class="tab">Daftar</button>
      </div>
      <form id="login-form" class="auth-form">
        <label>Email</label>
        <input type="email" id="login-email" required autocomplete="email" />
        <label>Password</label>
        <input type="password" id="login-password" required minlength="6" autocomplete="current-password" />
        <button type="submit" class="btn primary" id="login-submit">Masuk</button>
        <p id="login-error" class="error"></p>
      </form>
      <form id="register-form" class="auth-form hidden">
        <label>Nama</label>
        <input type="text" id="reg-name" autocomplete="name" />
        <label>Email</label>
        <input type="email" id="reg-email" required autocomplete="email" />
        <label>Password</label>
        <input type="password" id="reg-password" required minlength="6" autocomplete="new-password" />
        <button type="submit" class="btn primary" id="reg-submit">Daftar</button>
        <p id="reg-error" class="error"></p>
      </form>
    </div>
  </div>

  <script src="/js/login.js?v=5"></script>
</body>
</html>
