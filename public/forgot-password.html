<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — ZoraBot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/style.css?v=26" />
</head>
<body>
  <div id="auth-view" class="auth-wrap">
    <div class="auth-card">
      <h1>ZoraBot</h1>
      <p class="subtitle">Reset Password</p>
      <p id="notice" class="auth-notice hidden"></p>

      <form id="request-form" class="auth-form">
        <label>Email</label>
        <input type="email" id="fp-email" required autocomplete="email" />
        <button type="submit" class="btn primary" id="request-submit">Send code</button>
        <p id="request-error" class="error"></p>
      </form>

      <form id="reset-form" class="auth-form hidden">
        <label>OTP code (sent to your email)</label>
        <input type="text" id="fp-code" inputmode="numeric" maxlength="6" required autocomplete="one-time-code" />
        <label>New password</label>
        <input type="password" id="fp-password" required minlength="6" autocomplete="new-password" />
        <button type="submit" class="btn primary" id="reset-submit">Reset Password</button>
        <p id="reset-error" class="error"></p>
        <p class="subtitle" style="margin-top:10px"><a href="#" id="resend-link">Resend code</a></p>
      </form>

      <p class="subtitle" style="margin-top:14px"><a href="/login">Back to sign in</a></p>
    </div>
  </div>

  <script src="/js/bg-pattern.js?v=26"></script>
  <script src="/js/forgot-password.js?v=26"></script>

<footer id="site-footer" class="site-footer">
  <div class="site-footer-links">
    <a href="/terms">Terms of Service</a><span class="site-footer-sep">|</span>
    <a href="/privacy">Privacy Policy</a><span class="site-footer-sep">|</span>
    <a href="/login">Login</a><span class="site-footer-sep">|</span>
    <a href="https://t.me/reyzxdv" target="_blank" rel="noopener">CS Telegram</a>
  </div>
  <p class="site-footer-copy">&copy; 2026 ZoraBot. All rights reserved.</p>
</footer>

</body>
</html>
