<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — ZoraBot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/style.css?v=23" />
</head>
<body data-page="admin">
  <div id="loading-view" class="loading-wrap hidden" style="display:none">
    <div class="loading-card">
      <div class="loading-logo">ZoraBot</div>
      <div class="spinner center" aria-hidden="true">
        <div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div>
        <div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div>
        <div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div>
        <div class="spinner-blade"></div><div class="spinner-blade"></div><div class="spinner-blade"></div>
      </div>
      <p class="loading-text" id="loading-text">Memuat...</p>
    </div>
  </div>

  <div id="main-view">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">ZoraBot</div>
      <div class="user-chip" id="user-chip"></div>
    </header>

    <aside id="sidebar" class="sidebar">
      <nav>
        <div class="nav-label">Admin</div>
        <a href="/admin" class="nav-item active"><i class="fa-solid fa-gauge-high"></i><span>Overview</span></a>
        <a href="/admin/users" class="nav-item"><i class="fa-solid fa-users"></i><span>Users</span></a>
        <a href="/admin/bots" class="nav-item"><i class="fa-solid fa-robot"></i><span>Bots</span></a>
<a href="/admin/ads" class="nav-item"><i class="fa-solid fa-bullhorn"></i><span>Ads / Iklan</span></a>
        <div class="nav-label">Kembali</div>
        <a href="/dashboard" class="nav-item"><i class="fa-solid fa-arrow-left"></i><span>Dashboard</span></a>
        <a href="/account" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
      </nav>
      <button id="logout-btn" class="btn outline logout"><i class="fa-solid fa-right-from-bracket"></i><span>Keluar</span></button>
    </aside>
    <div id="sidebar-overlay" class="overlay"></div>

    <main class="content">
      <h2>Admin Panel</h2>
      <p class="hint">Kelola users, bots, dan iklan. Hanya akun admin.</p>
      <div id="admin-stats" class="limits-bar" style="margin-bottom:16px"></div>

      <div class="admin-subnav">
        <a href="/admin/users"><i class="fa-solid fa-users"></i> Users</a>
        <a href="/admin/bots"><i class="fa-solid fa-robot"></i> Bots</a>
<a href="/admin/ads"><i class="fa-solid fa-bullhorn"></i> Ads / Iklan</a>
      </div>

      <div class="plan-card" style="margin-bottom:16px">
        <h3>Orders terbaru</h3>
        <div id="admin-orders" class="bots-list" style="margin-top:12px"></div>
      </div>
    </main>
  </div>

  <script src="/js/bg-pattern.js?v=17"></script>
  <script src="/js/common.js?v=23"></script>
  <script src="/js/admin.js?v=23"></script>
  <script>
  setTimeout(function () {
    var lv = document.getElementById('loading-view');
    var mv = document.getElementById('main-view');
    if (lv && getComputedStyle(lv).display !== 'none') {
      lv.classList.add('hidden'); lv.style.display = 'none';
      if (mv) { mv.classList.remove('hidden'); mv.style.display = ''; }
    }
  }, 1500);
  </script>
</body>
</html>
