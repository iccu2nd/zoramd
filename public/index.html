<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZoraBot</title>
  <meta http-equiv="refresh" content="0; url=/dashboard" />
  <script>
    // Jika ada token → dashboard, jika tidak → login
    if (localStorage.getItem('token')) {
      location.replace('/dashboard')
    } else {
      location.replace('/login?reason=required&next=/dashboard')
    }
  </script>
</head>
<body>
  <p style="font-family:system-ui;text-align:center;margin-top:40vh;color:#6b7280">Mengalihkan...</p>
</body>
</html>
