<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connect Bot — ZoraBot</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="connect">
  <div id="loading-view" class="loading-wrap">
    <div class="loading-card">
      <div class="loading-logo">ZoraBot</div>
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-text" id="loading-text">Memuat...</p>
    </div>
  </div>

  <div id="main-view" class="hidden">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">ZoraBot</div>
      <div class="user-chip" id="user-chip"></div>
    </header>

    <aside id="sidebar" class="sidebar">
            <nav>
        <div class="nav-label">Menu</div>
        <a href="/dashboard" class="nav-item">Dashboard</a>
        <a href="/connect" class="nav-item active">Connect Bot</a>
        <a href="/bot-settings" class="nav-item">Bot Settings</a>
        <a href="/feature-settings" class="nav-item">Feature Settings</a>
        <a href="/database" class="nav-item">Database</a>
        <div class="nav-label">Premium</div>
        <a href="/upgrade" class="nav-item">Order Plan Premium</a>
        <div class="nav-label">Akun</div>
        <a href="/account" class="nav-item">Account</a>
        <a href="/admin" class="nav-item nav-admin hidden" id="nav-admin">Admin Panel</a>
      </nav>
      <button id="logout-btn" class="btn outline logout">Keluar</button>
    </aside>
    <div id="sidebar-overlay" class="overlay"></div>

    <main class="content">
      <h2>Connect Bot</h2>
      <div class="field">
        <label>Pilih Bot</label>
        <select id="connect-bot-select"></select>
      </div>
      <div class="row">
        <button type="button" id="restart-bot-btn" class="btn outline" title="Restart bot">↻ Restart Bot</button>
      </div>
      <div class="field">
        <label>Metode</label>
        <div class="radio-row">
          <label><input type="radio" name="connect-method" value="qr" checked /> QR Code</label>
          <label><input type="radio" name="connect-method" value="pairing" /> Pairing Code</label>
        </div>
      </div>
      <div id="pairing-phone-wrap" class="field hidden">
        <label>Nomor WhatsApp (bot)</label>
        <input type="tel" id="pairing-phone" inputmode="tel" autocomplete="tel" placeholder="628xxxxxxxxx" />
      </div>
      <div class="row gap">
        <button id="connect-start-btn" class="btn primary">Hubungkan</button>
        <button id="connect-stop-btn" class="btn outline">Putuskan</button>
        <button id="connect-logout-btn" class="btn danger">Logout Session</button>
      </div>
      <div id="connect-status" class="status-box"></div>
      <div id="qr-wrap" class="qr-wrap hidden">
        <img id="qr-img" alt="QR Code" />
        <p>Scan QR dengan WhatsApp → Perangkat Tertaut</p>
      </div>
      <div id="pairing-code-wrap" class="pairing-wrap hidden">
        <p>Masukkan kode ini di WhatsApp:</p>
        <div id="pairing-code" class="pairing-code"></div>
      </div>
    </main>
  </div>

  <script src="/js/bg-pattern.js?v=7"></script>
  <script src="/js/common.js?v=7"></script>
  <script src="/js/connect.js?v=7"></script>

  <script>
  // Safety net: jangan pernah stuck loading > 6 detik
  setTimeout(function () {
    var lv = document.getElementById('loading-view');
    var mv = document.getElementById('main-view');
    if (lv && !lv.classList.contains('hidden') && getComputedStyle(lv).display !== 'none') {
      lv.classList.add('hidden');
      lv.style.display = 'none';
      if (mv) { mv.classList.remove('hidden'); mv.style.display = ''; }
    }
  }, 6000);
  </script>
</body>
</html>
